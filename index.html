<style>
/* Layout: one column sized for a tablet on the wall; two columns when two people train at once. */
:root {
  --bg: #eceeed; --surface: #ffffff; --ink: #1a1e21; --muted: #5a6269; --rule: #d2d7d4; --well: #f4f5f4;
  --blue: #1d5aa6; --blue-ink: #ffffff; --blue-soft: #e2eaf6;
  --teal: #0c6f67; --teal-ink: #ffffff; --teal-soft: #dcefec;
  --good: #1c7541; --good-soft: #e1f1e7; --warn: #8f5405; --warn-soft: #f8ecd9; --bad: #b3261e; --bad-soft: #f9e4e2;
  --font-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --font-body: "Public Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --accent: var(--blue); --accent-ink: var(--blue-ink); --accent-soft: var(--blue-soft);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111315; --surface: #1b1f22; --ink: #e8ebed; --muted: #9aa3aa; --rule: #30373c; --well: #23282c;
    --blue: #7fadea; --blue-ink: #0b1a2c; --blue-soft: #1b2a3c;
    --teal: #55c7b9; --teal-ink: #08211e; --teal-soft: #152f2c;
    --good: #62d08f; --good-soft: #17301f; --warn: #f0b35a; --warn-soft: #33270f; --bad: #ff8a80; --bad-soft: #3a1b19;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111315; --surface: #1b1f22; --ink: #e8ebed; --muted: #9aa3aa; --rule: #30373c; --well: #23282c;
  --blue: #7fadea; --blue-ink: #0b1a2c; --blue-soft: #1b2a3c;
  --teal: #55c7b9; --teal-ink: #08211e; --teal-soft: #152f2c;
  --good: #62d08f; --good-soft: #17301f; --warn: #f0b35a; --warn-soft: #33270f; --bad: #ff8a80; --bad-soft: #3a1b19;
  color-scheme: dark;
}
.c-blue { --accent: var(--blue); --accent-ink: var(--blue-ink); --accent-soft: var(--blue-soft); }
.c-teal { --accent: var(--teal); --accent-ink: var(--teal-ink); --accent-soft: var(--teal-soft); }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 17px; line-height: 1.45; -webkit-text-size-adjust: 100%; }
#app { max-width: 46rem; margin: 0 auto; padding-top: 0.75rem; padding-bottom: 2rem; padding-block: 0.75rem 2rem;
  padding-left: 16px; padding-right: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
#app.v-workout { max-width: 78rem; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 700; line-height: 1.1; margin: 0; text-wrap: balance; }
h1 { font-size: 1.9rem; text-transform: uppercase; letter-spacing: 0.02em; }
h2 { font-size: 1.6rem; }
h3 { font-size: 1.15rem; margin: 1.1rem 0 0.4rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); }
p { margin: 0 0 0.7rem; }
button { font: inherit; color: inherit; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
button:focus-visible, select:focus-visible, input:focus-visible, summary:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.sub { color: var(--muted); font-size: 0.92rem; }
.hint { color: var(--muted); font-size: 0.92rem; margin: 0.75rem 0; }

/* buttons */
.btn { display: inline-block; min-height: 3rem; padding: 0.55rem 1rem; border-radius: 8px; border: 1.5px solid var(--rule); background: var(--surface); font-weight: 600; cursor: pointer; }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.big { display: block; width: 100%; min-height: 3.6rem; font-size: 1.15rem; }
.btn.small { min-height: 2.4rem; padding: 0.3rem 0.8rem; font-size: 0.95rem; }
.btn.round { width: 3.2rem; height: 3.2rem; min-height: 0; padding: 0; border-radius: 50%; font-size: 1.6rem; line-height: 1; }
.btn.danger { color: var(--bad); border-color: var(--bad); background: transparent; }
.link { background: none; border: 0; padding: 0.5rem 0.25rem; color: var(--accent); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
.back { background: none; border: 0; padding: 0.6rem 0.4rem 0.6rem 0; color: var(--accent); font-weight: 600; cursor: pointer; white-space: nowrap; }

/* header */
.top { display: flex; align-items: center; justify-content: space-between; padding: 0.35rem 0 0.9rem; }
.top h1 { flex: 1; min-width: 0; }
.top .back + h1 { margin-left: 0.75rem; }
.toplinks { white-space: nowrap; }
.toplinks .link + .link { margin-left: 0.75rem; }
.status { font-size: 0.85rem; color: var(--muted); white-space: nowrap; }
.status i { display: inline-block; width: 0.55rem; height: 0.55rem; border-radius: 50%; background: var(--good); margin-right: 0.4rem; }
.status.warn { color: var(--warn); }
.status.warn i { background: var(--warn); }

/* cards */
.card { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 1.1rem; margin-bottom: 1rem; }
.cardhead { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; margin-bottom: 0.4rem; }
.cardhead select { font: inherit; padding: 0.45rem 0.6rem; border-radius: 6px; border: 1.5px solid var(--rule); background: var(--surface); color: var(--ink); max-width: 100%; }
.empty { background: var(--surface); border: 1px dashed var(--rule); border-radius: 10px; padding: 1.5rem; text-align: center; }
.empty .btn { margin-top: 0.5rem; }

/* home */
.people { display: grid; grid-template-columns: 1fr; grid-gap: 1rem; }
@media (min-width: 640px) { .people.n2 { grid-template-columns: 1fr 1fr; } }
.person { border-top: 6px solid var(--accent); margin: 0; }
.person h2 { font-size: 2.2rem; text-transform: uppercase; letter-spacing: 0.02em; }
.person .next { font-family: var(--font-display); font-weight: 600; font-size: 1.5rem; margin-top: 0.6rem; }
.person .btn.big { margin-top: 0.9rem; }
.person .links { display: flex; justify-content: space-between; margin-top: 0.5rem; }

/* plan */
.planhead { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 0.6rem; }
.planhead h2 { font-size: 2.4rem; text-transform: uppercase; }
.notice { background: var(--warn-soft); border-radius: 8px; padding: 0.75rem 0.9rem; margin-bottom: 0.8rem; }
.notice p { margin: 0; }
.exlist { list-style: none; margin: 0; padding: 0; }
.exlist li { margin-bottom: 0.5rem; }
.exrow { display: flex; align-items: center; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 0.8rem 0.9rem; cursor: pointer; }
.exrow .n { font-family: var(--font-display); font-weight: 700; font-size: 1.4rem; color: var(--accent); width: 1.6rem; flex: none; }
.exrow .what { flex: 1; min-width: 0; }
.exrow .what b { display: block; }
.exrow .what .sub { display: block; }
.exrow .target { font-family: var(--font-display); font-weight: 700; font-size: 1.35rem; margin-left: 0.75rem; text-align: right; font-variant-numeric: tabular-nums; }
.exlist.compact .exrow { padding: 0.55rem 0.8rem; }
.exlist.compact .target { font-size: 1.1rem; }
.tag { display: inline-block; margin-top: 0.25rem; font-size: 0.8rem; font-weight: 600; padding: 0.1rem 0.5rem; border-radius: 999px; background: var(--well); color: var(--muted); }
.tag.new { background: var(--accent-soft); color: var(--accent); }
.tag.bad { background: var(--bad-soft); color: var(--bad); }
.tag.warn { background: var(--warn-soft); color: var(--warn); }
.stickybar { position: -webkit-sticky; position: sticky; bottom: 0; padding: 0.75rem 0 calc(0.75rem + env(safe-area-inset-bottom, 0px)); background: var(--bg); }

/* workout */
.panes.two { display: grid; grid-template-columns: 1fr 1fr; grid-gap: 1.25rem; }
.panes:not(.two) { max-width: 44rem; margin: 0 auto; }
.pane { min-width: 0; }
.tabs { display: flex; max-width: 44rem; margin: 0 auto 0.6rem; }
.tab { flex: 1; min-width: 0; min-height: 2.8rem; padding: 0.4rem 0.6rem; border: 1.5px solid var(--rule); background: var(--surface); font-weight: 600; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tab:first-child { border-radius: 8px 0 0 8px; }
.tab:last-child { border-radius: 0 8px 8px 0; border-left: 0; }
.tab.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.wtop { display: flex; align-items: center; justify-content: space-between; }
.wtop .who { font-weight: 600; color: var(--muted); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin: 0 0.5rem; }
.bar { height: 6px; background: var(--rule); border-radius: 3px; margin: 0.4rem 0 0.9rem; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); }
.focus { background: var(--surface); border: 1px solid var(--rule); border-top: 6px solid var(--accent); border-radius: 10px; padding: 1rem 1.1rem 1.1rem; }
.exhead { display: flex; align-items: center; justify-content: space-between; }
.exhead .count { color: var(--muted); font-size: 0.9rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; }
.focus h2 { font-size: 2.1rem; text-transform: uppercase; letter-spacing: 0.01em; }
.setlabel { margin-top: 0.8rem; font-family: var(--font-display); font-weight: 600; font-size: 1.3rem; color: var(--accent); text-transform: uppercase; letter-spacing: 0.06em; }
.big { display: flex; align-items: baseline; flex-wrap: wrap; font-family: var(--font-display); font-weight: 700; line-height: 1; margin-top: 0.2rem; font-variant-numeric: tabular-nums; }
.big .wt { background: none; border: 0; border-bottom: 3px dotted var(--rule); padding: 0; cursor: pointer; font: inherit; }
.big .w { font-size: 4.2rem; }
.big .x { font-size: 2.6rem; color: var(--muted); margin: 0 0.9rem; }
.big .r { font-size: 5.4rem; }
.panes.two .big .w { font-size: 3.2rem; }
.panes.two .big .r { font-size: 4.2rem; }
@media (max-width: 420px) { .big .w { font-size: 3.1rem; } .big .r { font-size: 4.2rem; } .big .x { margin: 0 0.5rem; } }
.notes { display: flex; justify-content: space-between; flex-wrap: wrap; color: var(--muted); font-size: 0.95rem; margin: 0.35rem 0 0.9rem; }
.notes span + span { margin-left: 1rem; }
.rest { font-family: var(--font-display); font-weight: 600; font-size: 1.5rem; padding: 0.4rem 0.8rem; border-radius: 8px; background: var(--well); margin-bottom: 0.8rem; font-variant-numeric: tabular-nums; }
.rest.over { background: var(--good-soft); color: var(--good); }
.btn.done { display: block; width: 100%; min-height: 5.5rem; font-family: var(--font-display); font-size: 2.6rem; text-transform: uppercase; letter-spacing: 0.04em; border-radius: 12px; }
.alts { display: grid; grid-template-columns: 1fr 1fr; grid-gap: 0.6rem; margin-top: 0.7rem; }
.alts .btn { min-height: 3.4rem; }
.under { display: flex; justify-content: space-between; margin-top: 0.5rem; }
.startbox, .missbox { background: var(--accent-soft); border-radius: 10px; padding: 0.9rem; margin-top: 0.8rem; }
.missbox { margin-top: 0; }
.startbox p, .missbox p { margin-bottom: 0.6rem; font-weight: 600; }
.stepper { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; }
.btn.jump { min-height: 3.2rem; min-width: 4rem; padding: 0 0.7rem; border-radius: 999px; margin: 0 0.5rem; font-variant-numeric: tabular-nums; }
.jumps { display: flex; justify-content: flex-end; margin: 0.2rem 0 0.6rem; }
.stepper .val { font-family: var(--font-display); font-weight: 700; font-size: 2.4rem; min-width: 7.5rem; text-align: center; font-variant-numeric: tabular-nums; }
.stepper.sm .val { font-size: 1.5rem; min-width: 6.5rem; }
.stepper.sm .btn.round { width: 2.8rem; height: 2.8rem; font-size: 1.4rem; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; grid-gap: 0.6rem; margin-top: 0.8rem; }
.mini { list-style: none; margin: 1rem 0 0; padding: 0; }
.mini li { display: flex; align-items: baseline; padding: 0.45rem 0.2rem; border-bottom: 1px solid var(--rule); color: var(--muted); }
.mini li.cur { color: var(--ink); font-weight: 600; }
.mini .mark { width: 1.4rem; flex: none; color: var(--accent); }
.mini .nm { flex: 1; min-width: 0; }
.mini .tg { font-variant-numeric: tabular-nums; white-space: nowrap; margin-left: 0.6rem; }
.addother { text-align: center; margin-top: 0.75rem; }

/* summary */
.summary { background: var(--surface); border: 1px solid var(--rule); border-top: 6px solid var(--accent); border-radius: 10px; padding: 1.2rem; }
.summary h2 { font-size: 2.2rem; text-transform: uppercase; }
.changes { list-style: none; margin: 0.9rem 0; padding: 0; }
.changes li { padding: 0.6rem 0 0.6rem 0.8rem; border-left: 4px solid var(--rule); margin-bottom: 0.5rem; }
.changes li b, .changes li span { display: block; }
.changes li.good { border-color: var(--good); }
.changes li.bad { border-color: var(--bad); }
.changes li.warn { border-color: var(--warn); }

/* progress */
.tiles { display: grid; grid-template-columns: repeat(4, 1fr); grid-gap: 0.6rem; margin-bottom: 1rem; }
@media (max-width: 480px) { .tiles { grid-template-columns: 1fr 1fr; } }
.tiles div { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 0.7rem 0.8rem; }
.tiles b { display: block; font-family: var(--font-display); font-size: 2.2rem; line-height: 1; font-variant-numeric: tabular-nums; }
.tiles span { color: var(--muted); font-size: 0.85rem; }
.chart { display: block; width: 100%; height: auto; margin-top: 0.5rem; }
.chart .grid { stroke: var(--rule); stroke-width: 1; }
.chart .tick { fill: var(--muted); font-size: 13px; font-family: var(--font-body); }
.chart .line { fill: none; stroke: var(--accent); stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; }
.chart .area { fill: var(--accent); opacity: 0.12; }
.chart .dot { fill: var(--surface); stroke: var(--accent); stroke-width: 2.5; }
.chart .dot.last { fill: var(--accent); }
.chart .dot.miss { stroke: var(--bad); }
.chart .col { fill: var(--accent); }
.chart .col.empty { fill: var(--rule); }
.recent { list-style: none; margin: 0.6rem 0 0; padding: 0; }
.recent li { display: flex; align-items: baseline; padding: 0.4rem 0; border-bottom: 1px solid var(--rule); }
.recent li:last-child { border-bottom: 0; }
.recent span { flex: 1; min-width: 0; color: var(--muted); }
.recent b { font-variant-numeric: tabular-nums; text-align: right; margin-left: 0.6rem; }
.recent em { font-style: normal; color: var(--muted); font-size: 0.85rem; margin-left: 0.6rem; white-space: nowrap; }
details { border-bottom: 1px solid var(--rule); }
details summary { display: flex; align-items: baseline; padding: 0.6rem 0; cursor: pointer; }
details summary span { width: 4.5rem; color: var(--muted); flex: none; }
details summary b { flex: 1; }
details summary em { font-style: normal; color: var(--muted); font-size: 0.9rem; }
details .recent { margin: 0 0 0.6rem; padding-left: 0.5rem; }
.cal { display: flex; margin-top: 0.6rem; }
.calcol { flex: 1; display: grid; grid-template-rows: repeat(7, 1fr); grid-gap: 4px; margin-right: 4px; }
.cal i { display: block; height: 1.1rem; border-radius: 3px; background: var(--well); }
.cal i.u, .legend i.u { background: var(--accent); }
.cal i.l, .legend i.l { background: var(--muted); }
.cal i.future { background: transparent; border: 1px dashed var(--rule); }
.cal i.now { box-shadow: 0 0 0 2px var(--ink); }
.legend { margin-top: 0.5rem; color: var(--muted); font-size: 0.85rem; }
.legend span { margin-right: 1rem; }
.legend i { display: inline-block; width: 0.8rem; height: 0.8rem; border-radius: 2px; margin-right: 0.3rem; vertical-align: -1px; }
.reviewtext { white-space: pre-wrap; }
.sugs { list-style: none; margin: 0 0 0.8rem; padding: 0; }
.sugs li { padding: 0.7rem 0; border-top: 1px solid var(--rule); }
.sugs b, .sugs span { display: block; }
.sugs span { color: var(--muted); margin: 0.2rem 0 0.5rem; }
.sugs em { font-style: normal; color: var(--good); font-weight: 600; }
.warnText { color: var(--warn); }

/* settings */
.setrow { display: flex; align-items: center; justify-content: space-between; padding: 0.55rem 0; border-top: 1px solid var(--rule); }
.setrow > span { flex: 1; min-width: 0; margin-right: 0.75rem; }
.setrow.col { display: block; }
.setrow.col > span { display: block; margin-bottom: 0.5rem; }
.card h2 + .setrow { border-top: 0; }
.seg { display: flex; }
.segb { flex: 1; min-height: 2.8rem; padding: 0.4rem 0.5rem; border: 1.5px solid var(--rule); background: var(--surface); font-weight: 600; font-size: 0.92rem; cursor: pointer; }
.segb + .segb { border-left: 0; }
.segb:first-child { border-radius: 8px 0 0 8px; }
.segb:last-child { border-radius: 0 8px 8px 0; }
.segb.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.field { display: block; margin: 0.7rem 0; }
.field span { display: block; font-size: 0.92rem; color: var(--muted); margin-bottom: 0.25rem; }
.field input { width: 100%; font: inherit; padding: 0.6rem 0.7rem; border-radius: 8px; border: 1.5px solid var(--rule); background: var(--surface); color: var(--ink); }

/* sheets */
.scrim { position: fixed; top: 0; right: 0; bottom: 0; left: 0; background: rgba(0, 0, 0, 0.5); z-index: 10; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 11; max-height: 88vh; overflow-y: auto; -webkit-overflow-scrolling: touch;
  background: var(--surface); border-radius: 16px 16px 0 0; max-width: 46rem; margin: 0 auto;
  padding: 1.2rem max(16px, env(safe-area-inset-right, 0px)) calc(1.4rem + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.sheet h2 { padding-right: 3rem; }
.sheet .close { position: absolute; top: 0.6rem; right: 0.8rem; width: 2.8rem; height: 2.8rem; border-radius: 50%; border: 0; background: var(--well); font-size: 1.6rem; line-height: 1; cursor: pointer; }
.sheet > .btn { margin-top: 0.6rem; }
.photos { display: grid; grid-template-columns: 1fr 1fr; grid-gap: 0.6rem; margin: 0.6rem 0; }
.photos figure { margin: 0; }
.photos img { display: block; width: 100%; height: auto; border-radius: 8px; background: var(--well); }
.photos figcaption { font-size: 0.85rem; color: var(--muted); margin-top: 0.2rem; }
.cues { margin: 0; padding-left: 1.2rem; }
.cues li { margin-bottom: 0.35rem; }
details.steps { margin-top: 0.8rem; border-top: 1px solid var(--rule); border-bottom: 0; }
details.steps summary { font-weight: 600; color: var(--accent); }
details.steps ol { padding-left: 1.3rem; margin: 0; color: var(--muted); }
details.steps li { margin-bottom: 0.5rem; }
.choices { display: grid; grid-template-columns: 1fr 1fr; grid-gap: 0.6rem; }
@media (max-width: 420px) { .choices { grid-template-columns: 1fr; } }
@media (prefers-reduced-motion: no-preference) { .btn { transition: transform 0.05s; } }

.credit { margin-top: 0.9rem; }
.empty .field { text-align: left; }

/* Older iPads (before iOS 10.3) have no CSS grid: lay the same blocks out with flexbox. */
@supports not (display: grid) {
  .people, .alts, .row2, .tiles, .photos, .choices, .panes.two { display: -webkit-flex; display: flex; -webkit-flex-wrap: wrap; flex-wrap: wrap; margin-left: -0.3rem; margin-right: -0.3rem; }
  .people > *, .alts > *, .row2 > *, .photos > *, .choices > *, .panes.two > * { -webkit-flex: 1 1 45%; flex: 1 1 45%; margin: 0.3rem; }
  .tiles > * { -webkit-flex: 1 1 20%; flex: 1 1 20%; margin: 0.3rem; }
  .calcol { display: block; }
  .calcol i { margin-bottom: 4px; }
}

.planlen { margin: -0.3rem 0 0.8rem; font-size: 1rem; color: var(--muted, inherit); }

/* Note from a scheduled Claude review, on a person's card on the first screen. */
.rvnote { border: 1.5px solid var(--rule); border-radius: 10px; padding: 0.7rem 0.8rem; margin: 0.2rem 0 0.9rem; text-align: left; }
.rvnote .rvhead { font-weight: 700; margin-bottom: 0.3rem; }
.rvnote .reviewtext { margin: 0 0 0.5rem; }
.rvnote .sugs { margin-bottom: 0.5rem; }
.alt { margin-top: 0.9rem; }
.alt summary { color: var(--muted); padding: 0.3rem 0; }
.alt { border-bottom: 0; }
</style>

    var prog = E.progress(s);
    var loggedSomething = s.items.some(function (it) {
      return it.sets.some(function (x) { return x.st === 'done' || x.st === 'fail'; });
    });
    delete rest[pid];
    if (!prog.done || !loggedSomething) {
      s.status = 'void'; s.end = Date.now();
      Store.saveSession(s);
      return null;
    }
    var res = E.finishSession(p, s, equip(), LIB, Date.now());
    if (!quiet) ui.summary[pid] = { session: s, changes: res.changes };
    Store.saveSession(s);
    res.profile.rev = p.rev;
    Store.saveProfile(res.profile);
    return res;
  }

  // ---------- charts ----------
  function lineChart(pts) {
    var W = 600, H = 190, L = 46, R = 18, T = 16, B = 26;
    var ys = pts.map(function (p) { return p.y; });
    var min = Math.min.apply(null, ys), max = Math.max.apply(null, ys);
    if (max === min) { max += 1; min -= 1; }
    var pad = (max - min) * 0.18; min -= pad; max += pad;
    function x(i) { return pts.length === 1 ? L + (W - L - R) / 2 : L + i * (W - L - R) / (pts.length - 1); }
    function y(v) { return T + (max - v) * (H - T - B) / (max - min); }
    var grid = '', i;
    for (i = 0; i < 3; i++) {
      var v = min + pad + (max - min - 2 * pad) * i / 2;
      grid += '<line class="grid" x1="' + L + '" x2="' + (W - R) + '" y1="' + y(v).toFixed(1) + '" y2="' + y(v).toFixed(1) + '"/>' +
        '<text class="tick" x="' + (L - 8) + '" y="' + (y(v) + 4).toFixed(1) + '" text-anchor="end">' + Math.round(v) + '</text>';
    }
    var path = pts.map(function (p, k) { return (k ? 'L' : 'M') + x(k).toFixed(1) + ' ' + y(p.y).toFixed(1); }).join(' ');
    var area = path + ' L' + x(pts.length - 1).toFixed(1) + ' ' + (H - B) + ' L' + x(0).toFixed(1) + ' ' + (H - B) + ' Z';
    var dots = pts.map(function (p, k) {
      return '<circle class="dot' + (p.ok === false ? ' miss' : '') + (k === pts.length - 1 ? ' last' : '') + '" cx="' + x(k).toFixed(1) + '" cy="' + y(p.y).toFixed(1) + '" r="' + (k === pts.length - 1 ? 6 : 4) + '"/>';
    }).join('');
    var labels = '<text class="tick" x="' + L + '" y="' + (H - 6) + '">' + esc(pts[0].label) + '</text>';
    if (pts.length > 1) labels += '<text class="tick" x="' + (W - R) + '" y="' + (H - 6) + '" text-anchor="end">' + esc(pts[pts.length - 1].label) + '</text>';
    return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Progress chart">' + grid +
      '<path class="area" d="' + area + '"/><path class="line" d="' + path + '"/>' + dots + labels + '</svg>';
  }

  function barChart(weeks) {
    var W = 600, H = 150, L = 30, R = 10, T = 12, B = 24;
    var max = Math.max.apply(null, weeks.map(function (w) { return w.sets; }).concat([1]));
    var bw = (W - L - R) / weeks.length;
    var bars = weeks.map(function (w, i) {
      var h = (H - T - B) * w.sets / max;
      return '<rect class="col' + (w.sets ? '' : ' empty') + '" x="' + (L + i * bw + 3).toFixed(1) + '" y="' + (H - B - Math.max(h, 2)).toFixed(1) +
        '" width="' + (bw - 6).toFixed(1) + '" height="' + Math.max(h, 2).toFixed(1) + '" rx="2"/>';
    }).join('');
    var txt = '<text class="tick" x="' + (L - 6) + '" y="' + (T + 4) + '" text-anchor="end">' + max + '</text>' +
      '<text class="tick" x="' + (L - 6) + '" y="' + (H - B) + '" text-anchor="end">0</text>' +
      '<text class="tick" x="' + L + '" y="' + (H - 6) + '">' + fmtDate(weeks[0].week) + '</text>' +
      '<text class="tick" x="' + (W - R) + '" y="' + (H - 6) + '" text-anchor="end">This week</text>';
    return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Sets per week">' + bars + txt + '</svg>';
  }

  function calendar(pid, weeks) {
    var byDate = {};
    doneSessions(pid).forEach(function (s) { byDate[s.date] = s.wk.charAt(0) === 'U' ? 'u' : 'l'; });
    var start = E.parseDate(E.weekStart(today()));
    start.setDate(start.getDate() - 7 * (weeks - 1));
    var cols = '';
    for (var w = 0; w < weeks; w++) {
      var cells = '';
      for (var d = 0; d < 7; d++) {
        var day = new Date(start.getTime()); day.setDate(start.getDate() + w * 7 + d);
        var key = E.today(day), cls = byDate[key] || '';
        if (key > today()) cls = 'future';
        cells += '<i class="' + cls + (key === today() ? ' now' : '') + '" title="' + fmtDate(key) + '"></i>';
      }
      cols += '<div class="calcol">' + cells + '</div>';
    }
    return '<div class="cal" aria-label="Workout calendar, last ' + weeks + ' weeks">' + cols + '</div>' +
      '<div class="legend"><span><i class="u"></i> Upper</span><span><i class="l"></i> Lower</span></div>';
  }

  // ---------- screens ----------
  function statusLine() {
    var txt, cls = '';
    if (Store.mode === 'local' && BUILD && Sync.has()) {
      if (Sync.state === 'error') { txt = 'Backup failed. See Settings.'; cls = 'warn'; }
      else txt = Sync.state === 'sending' ? 'Backing up' : 'Saved and backed up';
    }
    else if (Store.mode === 'local') { txt = 'Saved on this device only'; cls = 'warn'; }
    else if (!Store.confirmed) { txt = Store.slow ? 'Can\'t reach your saved data yet' : 'Loading'; cls = Store.slow ? 'warn' : ''; }
    else if (Store.error && Store.pending()) { txt = 'Not saved online yet. Will retry.'; cls = 'warn'; }
    else if (Store.pending()) txt = 'Saving';
    else txt = 'Saved';
    return '<span class="status ' + cls + '"><i></i>' + txt + '</span>';
  }

  function homeView() {
    var ps = profiles();
    var head = '<header class="top"><h1>Garage Gym</h1>' + statusLine() + '</header>';
    if (!ps.length) {
      if (!Store.confirmed) {
        return head + '<div class="empty"><p>' + (Store.slow ? 'Can\'t reach your saved data yet. Check the Wi-Fi.' : 'Loading your data.') + '</p></div>';
      }
      return head + '<div class="empty"><p>Who is training? Each person gets the same four workouts and their own weights.</p>' +
        '<label class="field"><span>First person</span><input id="name1" autocomplete="off" maxlength="20"></label>' +
        '<label class="field"><span>Second person (optional)</span><input id="name2" autocomplete="off" maxlength="20"></label>' +
        '<button class="btn primary big" data-act="setup">Create profiles</button></div>';
    }
    var cards = ps.map(function (p) {
      var s = activeSession(p.id), sum = E.summary(doneSessions(p.id), p.id, today());
      var wk = E.nextWorkout(p), action;
      if (s) {
        var pr = E.progress(s);
        action = '<div class="next">In progress: ' + E.WK_NAMES[s.wk] + '</div><div class="sub">' + pr.done + ' of ' + pr.total + ' sets logged</div>' +
          '<button class="btn primary big" data-act="continue" data-pid="' + p.id + '">Continue</button>';
      } else {
        action = '<div class="next">Next: ' + E.WK_NAMES[wk] + '</div><div class="sub">Last workout: ' + ago(sum.daysSince) + '</div>' +
          '<button class="btn primary big" data-act="open-plan" data-pid="' + p.id + '">Open workout</button>';
      }
      var note = '';
      if (p.review && p.review.auto && p.review.unread) {
        var ch = (p.review.suggestions || []).map(function (g) {
          return '<li><b>' + changeText(g) + '</b><span>' + esc(g.why || '') +
            (g.applied ? '' : ' Not applied, because this had changed after the review was written.') + '</span></li>';
        }).join('');
        note = '<div class="rvnote"><div class="rvhead">Claude review, ' + fmtDate(p.review.date) + '</div>' +
          (p.review.summary ? '<p class="reviewtext">' + esc(p.review.summary) + '</p>' : '') +
          (ch ? '<ul class="sugs">' + ch + '</ul>' : '') +
          '<button class="btn small" data-act="review-ok" data-pid="' + p.id + '">OK</button></div>';
      }
      return '<section class="card person ' + colorClass(p) + '"><h2>' + esc(p.name) + '</h2>' + note + action +
        '<div class="links"><button class="link" data-act="nav" data-view="progress" data-pid="' + p.id + '">Progress</button>' +
        '<button class="link" data-act="nav" data-view="settings" data-pid="' + p.id + '">Settings</button></div></section>';
    }).join('');
    return head + '<div class="people n' + ps.length + '">' + cards + '</div>';
  }

  // "48 sets, about 1 hr 40 min". The number of sets at the top weight is in Settings.
  function planLength(session, settings) {
    var sets = 0;
    session.items.forEach(function (it) { sets += it.sets.length; });
    var mins = E.estimateMinutes(session, settings), h = Math.floor(mins / 60), m = mins % 60;
    var time = h ? h + ' hr' + (m ? ' ' + m + ' min' : '') : m + ' min';
    return sets + ' sets, about ' + time;
  }

  function planView(pid) {
    var p = prof(pid), wk = E.nextWorkout(p);
    var prev = E.planSession(p, wk, today(), equip(), LIB, { ignoreGap: !!ui.gapOff[pid], now: 0, id: 'preview' });
    var held = prev.items.filter(function (it) { return it.note === 'hold'; }).length;
    var dropped = prev.items.filter(function (it) { return it.note === 'drop'; }).length;
    var gapDays = Math.max.apply(null, prev.items.map(function (it) { return it.gap || 0; }));
    var notice = '';
    if (held || dropped || ui.gapOff[pid]) {
      var msg = ui.gapOff[pid] ? 'Time-away adjustment is off for this workout.' :
        'It has been ' + gapDays + ' days since some of these. ' +
        (dropped ? 'Weights are about 10% lighter to ease back in.' : 'Targets repeat your last completed sets.');
      notice = '<div class="notice"><p>' + msg + '</p><button class="link" data-act="gap-toggle" data-pid="' + pid + '">' +
        (ui.gapOff[pid] ? 'Turn it back on' : 'Use normal targets') + '</button></div>';
    }
    var rows = prev.items.map(function (it, i) {
      var st = E.exState(p, it.ex, LIB), tag = '';
      if (it.needsStart) tag = '<span class="tag new">First time: pick a weight</span>';
      else if (st.flag === 'stalled') tag = '<span class="tag bad">Missed 3 times in a row</span>';
      else if (st.flag === 'maxed') tag = '<span class="tag warn">At your heaviest weight</span>';
      else if (it.note === 'hold') tag = '<span class="tag">Repeating last time</span>';
      else if (it.note === 'drop') tag = '<span class="tag">Lowered after time away</span>';
      var kinds = { light: 0, lead: 0, top: 0 };
      it.sets.forEach(function (s) { kinds[s.k]++; });
      var total = it.sets.length, setsText = total + (total === 1 ? ' set' : ' sets');
      if (it.needsStart) setsText = kinds.top + (kinds.top === 1 ? ' set' : ' sets') + ', plus warm-up sets once you pick a weight';
      else if (kinds.light || kinds.lead) {
        var parts = [];
        if (kinds.light) parts.push(kinds.light + ' light');
        if (kinds.lead) parts.push('1 lead-in');
        parts.push(kinds.top + ' top');
        setsText += ': ' + parts.join(', ');
      }
      return '<li><button class="exrow" data-act="ex-sheet" data-pid="' + pid + '" data-wk="' + wk + '" data-i="' + i + '">' +
        '<span class="n">' + (i + 1) + '</span><span class="what"><b>' + esc(exName(it.ex)) + '</b>' +
        '<span class="sub">' + setsText + '</span>' + tag + '</span>' +
        '<span class="target">' + (it.needsStart ? 'Set weight' : esc(targetText(it.ex, it.target.w, it.target.r))) + '</span></button></li>';
    }).join('');
    return '<div class="' + colorClass(p) + '">' +
      '<header class="top"><button class="back" data-act="nav" data-view="home">‹ Home</button><h1>' + esc(p.name) + '</h1>' +
      '<span class="toplinks"><button class="link" data-act="nav" data-view="progress" data-pid="' + pid + '">Progress</button>' +
      '<button class="link" data-act="nav" data-view="settings" data-pid="' + pid + '">Settings</button></span></header>' +
      '<div class="planhead"><h2>' + E.WK_NAMES[wk] + '</h2><button class="link" data-act="wk-sheet" data-pid="' + pid + '">Change workout</button></div>' +
      '<p class="sub planlen">' + planLength(prev, p.settings) + '</p>' +
      notice + '<ol class="exlist">' + rows + '</ol>' +
      '<p class="hint">Tap an exercise to see how to do it, change its weight, or swap it.</p>' +
      '<div class="stickybar"><button class="btn primary big" data-act="start" data-pid="' + pid + '">Start workout</button></div></div>';
  }

  function workoutPane(pid, multi) {
    var p = prof(pid);
    if (ui.summary[pid]) return summaryPane(pid);
    var s = activeSession(pid);
    if (!s) return '<section class="pane ' + colorClass(p) + '"><p class="hint">No workout in progress.</p></section>';
    var cur = E.cursor(s);
    if (!cur) return '';
    var it = s.items[cur.i], set = it.sets[cur.j], ex = LIB[it.ex];
    var prog = E.progress(s);
    var canFlag = set.k !== 'light';
    var m = ui.missed[pid];
    var first = it.needsStart && !it.sets.some(function (x) { return x.st !== null; });
    var q = equip();
    var startBox = '';
    if (first) {
      startBox = '<div class="startbox"><p>First time on this exercise. Pick a weight you could lift for about ' + (it.target.r + 3) + ' reps.</p>' +
        '<div class="stepper">' + jumpBtn(ex.eq, -4, pid) +
        '<button class="btn round" data-act="adj-w" data-dir="-1" data-pid="' + pid + '" aria-label="Lighter">−</button>' +
        '<span class="val">' + esc(weightText(ex.eq, it.target.w)) + '</span>' +
        '<button class="btn round" data-act="adj-w" data-dir="1" data-pid="' + pid + '" aria-label="Heavier">+</button>' +
        jumpBtn(ex.eq, 4, pid) + '</div></div>';
    }
    var main;
    if (m) {
      main = '<div class="missbox"><p>How many reps did you get?</p><div class="stepper">' +
        '<button class="btn round" data-act="miss-step" data-dir="-1" data-pid="' + pid + '" aria-label="Fewer">−</button>' +
        '<span class="val">' + m.n + '</span>' +
        '<button class="btn round" data-act="miss-step" data-dir="1" data-pid="' + pid + '" aria-label="More">+</button></div>' +
        '<div class="row2"><button class="btn" data-act="miss-cancel" data-pid="' + pid + '">Cancel</button>' +
        '<button class="btn primary" data-act="miss-save" data-pid="' + pid + '">Save</button></div></div>';
    } else {
      main = '<button class="btn primary done" data-act="log" data-kind="done" data-pid="' + pid + '">Done</button>' +
        '<div class="alts">' +
        (canFlag ? '<button class="btn" data-act="log" data-kind="easy" data-pid="' + pid + '">Easy</button>' +
          '<button class="btn" data-act="log" data-kind="veasy" data-pid="' + pid + '">Way too easy</button>' +
          '<button class="btn" data-act="miss-open" data-pid="' + pid + '">Missed reps</button>' : '') +
        '<button class="btn" data-act="log" data-kind="skip" data-pid="' + pid + '">Skip set</button></div>';
    }
    var list = s.items.map(function (x, i) {
      var doneSets = x.sets.filter(function (y) { return y.st !== null; }).length;
      var cls = i < cur.i ? 'past' : (i === cur.i ? 'cur' : '');
      var skipped = x.sets.every(function (y) { return y.st === 'skip'; });
      return '<li class="' + cls + '"><span class="mark">' + (i < cur.i ? (skipped ? '–' : '✓') : (i === cur.i ? '▸' : '')) + '</span>' +
        '<span class="nm">' + esc(exName(x.ex)) + '</span><span class="tg">' + (i === cur.i ? doneSets + ' of ' + x.sets.length + ' sets' :
          esc(targetText(x.ex, x.target.w, x.target.r))) + '</span></li>';
    }).join('');
    var anyLogged = prog.done > 0;
    return '<section class="pane ' + colorClass(p) + '">' +
      '<header class="wtop"><button class="back" data-act="nav" data-view="home">‹ Home</button>' +
      '<span class="who">' + esc(p.name) + ' · ' + E.WK_NAMES[s.wk] + '</span>' +
      '<button class="btn small" data-act="finish-ask" data-pid="' + pid + '">Finish</button></header>' +
      '<div class="bar"><i style="width:' + Math.round(100 * prog.done / prog.total) + '%"></i></div>' +
      '<div class="focus">' +
      '<div class="exhead"><span class="count">Exercise ' + (cur.i + 1) + ' of ' + s.items.length + '</span>' +
      '<button class="link" data-act="howto" data-key="' + it.ex + '">How to</button></div>' +
      '<h2>' + esc(ex.name) + '</h2>' + startBox +
      '<div class="setlabel">' + setLabel(it, cur.j) + '</div>' +
      '<div class="big"><button class="wt" data-act="adj-sheet" data-pid="' + pid + '" aria-label="Change weight or reps">' +
      '<span class="w">' + esc(weightText(ex.eq, set.w)) + '</span></button>' +
      (ex.eq === 'body' ? '' : '<span class="x">×</span>') + '<span class="r">' + set.r + '</span></div>' +
      '<div class="notes"><span>' + esc(weightNote(ex.eq, set.w)) + '</span><span>' + esc(repsText(it.ex, set.r)) + '</span></div>' +
      '<div class="rest" data-rest="' + pid + '" hidden></div>' +
      main +
      '<div class="under">' + (anyLogged ? '<button class="link" data-act="undo" data-pid="' + pid + '">Undo last</button>' : '<span></span>') +
      '<button class="link" data-act="skip-ex" data-pid="' + pid + '">Skip this exercise</button></div>' +
      '</div>' +
      '<ol class="mini">' + list + '</ol>' +
      (multi ? '' : addOtherButton(pid)) +
      '</section>';
  }

  // A bigger jump for the bar and plate-loaded machines, so a first weight takes few taps.
  function jumpBtn(eq, steps, pid) {
    if (eq !== 'bar' && eq !== 'mach') return '';
    var q = equip(), amt = Math.abs(steps) * (eq === 'bar' ? q.barStep : q.machStep);
    return '<button class="btn jump" data-act="adj-w" data-dir="' + steps + '" data-pid="' + pid + '">' + (steps < 0 ? '−' : '+') + num(amt) + '</button>';
  }

  function addOtherButton(pid) {
    var others = profiles().filter(function (o) { return o.id !== pid && !activeSession(o.id); });
    if (!others.length) return '';
    return '<div class="addother">' + others.map(function (o) {
      return '<button class="link" data-act="open-plan" data-pid="' + o.id + '">' + esc(o.name) + ' is working out too</button>';
    }).join('') + '</div>';
  }

  function summaryPane(pid) {
    var p = prof(pid), sm = ui.summary[pid], s = sm.session;
    var mins = Math.max(1, Math.round((s.end - s.start) / 60000));
    var setsDone = 0;
    s.items.forEach(function (it) { it.sets.forEach(function (x) { if (x.st === 'done' || x.st === 'fail') setsDone++; }); });
    var skipped = [];
    var rows = sm.changes.map(function (c) {
      var name = esc(exName(c.ex)), t = esc(targetText(c.ex, c.to.w, c.to.r));
      if (c.kind === 'none') { skipped.push(name); return ''; }
      var txt, cls = '';
      if (c.kind === 'reps') { txt = 'Next time: ' + t + ' (' + (c.to.r - c.from.r) + ' more ' + (c.to.r - c.from.r === 1 ? 'rep' : 'reps') + ')'; cls = 'good'; }
      else if (c.kind === 'up') { txt = 'Weight goes up. Next time: ' + t; cls = 'good'; }
      else if (c.kind === 'weight') { txt = 'Too easy, so the weight goes up. Next time: ' + t; cls = 'good'; }
      else if (c.kind === 'repeat') txt = 'Same target next time: ' + t;
      else if (c.kind === 'stalled') { txt = 'Missed three times in a row. Lower the weight or swap it from the workout screen.'; cls = 'bad'; }
      else if (c.kind === 'maxed') { txt = 'You are at the top of the range with your heaviest weight. Swap it for a harder exercise or get heavier weights.'; cls = 'warn'; }
      return '<li class="' + cls + '"><b>' + name + '</b><span>' + txt + '</span></li>';
    }).join('');
    return '<section class="pane summary ' + colorClass(p) + '"><h2>' + E.WK_NAMES[s.wk] + ' done</h2>' +
      '<p class="sub">' + esc(p.name) + ' · ' + mins + ' min · ' + setsDone + ' sets</p>' +
      '<ul class="changes">' + rows + '</ul>' +
      (skipped.length ? '<p class="hint">Skipped, unchanged: ' + skipped.join(', ') + '.</p>' : '') +
      '<button class="btn primary big" data-act="summary-close" data-pid="' + pid + '">Done</button></section>';
  }

  function workoutView() {
    var act = activePids().concat(Object.keys(ui.summary).filter(function (k) { return ui.summary[k] && !activeSession(k); }));
    act = act.filter(function (v, i) { return act.indexOf(v) === i && prof(v); });
    if (act.indexOf(view.pid) < 0) view.pid = act[0];
    if (!view.pid) { view = { name: 'home' }; return homeView(); }
    var wide = window.innerWidth >= 900;
    if (act.length > 1 && wide) {
      return '<div class="panes two">' + act.map(function (id) { return workoutPane(id, true); }).join('') + '</div>';
    }
    var tabs = '';
    if (act.length > 1) {
      tabs = '<div class="tabs">' + act.map(function (id) {
        var p = prof(id), s = activeSession(id), label = esc(p.name);
        if (s) { var c = E.cursor(s); if (c) label += ' · ' + esc(exName(s.items[c.i].ex)); }
        return '<button class="tab ' + colorClass(p) + (id === view.pid ? ' on' : '') + '" data-act="tab" data-pid="' + id + '">' + label + '</button>';
      }).join('') + '</div>';
    }
    return tabs + '<div class="panes">' + workoutPane(view.pid, act.length > 1) + '</div>';
  }

  function progressView(pid) {
    var p = prof(pid), done = doneSessions(pid), sum = E.summary(done, pid, today());
    var head = '<header class="top"><button class="back" data-act="open-plan" data-pid="' + pid + '">‹ ' + esc(p.name) + '</button><h1>Progress</h1><span></span></header>';
    if (!done.length) {
      return '<div class="' + colorClass(p) + '">' + head + '<div class="empty"><p>Nothing logged yet. Charts appear here after your first workout.</p></div></div>';
    }
    var tiles = '<div class="tiles">' +
      '<div><b>' + sum.total + '</b><span>workouts</span></div>' +
      '<div><b>' + sum.thisMonth + '</b><span>this month</span></div>' +
      '<div><b>' + sum.streak + '</b><span>' + (sum.streak === 1 ? 'week in a row' : 'weeks in a row') + '</span></div>' +
      '<div><b>' + (sum.daysSince <= 0 ? 'Today' : sum.daysSince + 'd') + '</b><span>since last</span></div></div>';
    // exercise chart
    var keys = [];
    done.forEach(function (s) { s.items.forEach(function (it) { if (keys.indexOf(it.ex) < 0 && E.series(done, pid, it.ex).length) keys.push(it.ex); }); });
    var sel = ui.chartEx[pid] && keys.indexOf(ui.chartEx[pid]) >= 0 ? ui.chartEx[pid] : keys[0];
    var chart = '';
    if (sel) {
      var ser = E.series(done, pid, sel), body = LIB[sel].eq === 'body';
      var pts = ser.map(function (x) { return { y: body ? x.reps : E.e1rm(x.w, x.reps), label: fmtDate(x.date), ok: x.ok }; });
      var first = pts[0].y, last = pts[pts.length - 1].y;
      var delta = pts.length > 1 ? Math.round((last - first) / first * 100) : 0;
      var recent = ser.slice(-5).reverse().map(function (x) {
        return '<li><span>' + fmtDate(x.date) + '</span><b>' + esc(targetText(sel, x.w, x.reps)) + '</b>' + (x.ok ? '' : '<em>missed ' + x.target + '</em>') + '</li>';
      }).join('');
      chart = '<section class="card"><div class="cardhead"><h2>By exercise</h2>' +
        '<select id="chart-ex" data-change="chart-ex" data-pid="' + pid + '">' + keys.map(function (k) {
          return '<option value="' + k + '"' + (k === sel ? ' selected' : '') + '>' + esc(exName(k)) + '</option>';
        }).join('') + '</select></div>' +
        '<p class="sub">' + (body ? 'Reps per set' : 'Strength score: estimated one-rep max, in lb, from your top set') +
        (pts.length > 1 ? ' · ' + (delta >= 0 ? 'up ' : 'down ') + Math.abs(delta) + '% since ' + pts[0].label : '') + '</p>' +
        lineChart(pts) + '<ul class="recent">' + recent + '</ul></section>';
    }
    var weeks = E.weekly(done, pid, LIB, 12, today());
    var recs = E.records(done, pid, LIB).slice(0, 8).map(function (r) {
      return '<li><span>' + esc(exName(r.ex)) + '</span><b>' + esc(targetText(r.ex, r.w, r.reps)) + '</b><em>' + fmtDate(r.date) + '</em></li>';
    }).join('');
    var hist = done.slice().sort(function (a, b) { return b.start - a.start; }).slice(0, 12).map(function (s) {
      var lines = s.items.map(function (it) {
        var tops = it.sets.filter(function (x) { return x.k === 'top'; });
        var res = tops.map(function (x) {
          if (x.st === 'done') return esc(targetText(it.ex, x.w, x.got)) + (x.easy ? ' (easy)' : '');
          if (x.st === 'fail') return esc(targetText(it.ex, x.w, x.got)) + ' (missed ' + x.r + ')';
          return 'skipped';
        }).join(', ');
        return '<li><span>' + esc(exName(it.ex)) + '</span><b>' + res + '</b></li>';
      }).join('');
      return '<details><summary><span>' + fmtDate(s.date) + '</span><b>' + E.WK_NAMES[s.wk] + '</b><em>' +
        Math.max(1, Math.round((s.end - s.start) / 60000)) + ' min</em></summary><ul class="recent">' + lines + '</ul></details>';
    }).join('');
    return '<div class="' + colorClass(p) + '">' + head + tiles + chart +
      '<section class="card"><h2>Last 12 weeks</h2>' + calendar(pid, 12) + '</section>' +
      '<section class="card"><h2>Hard sets per week</h2><p class="sub">Lead-in and top sets. Light sets are not counted.</p>' + barChart(weeks) + '</section>' +
      '<section class="card"><h2>Best sets</h2><ul class="recent">' + recs + '</ul></section>' +
      reviewCard(pid) +
      '<section class="card"><h2>Recent workouts</h2>' + hist + '</section></div>';
  }

  function changeText(g) {
    if (g.type === 'swap') return 'Swap ' + esc(exName(g.from)) + ' for ' + esc(exName(g.to)) + ' in ' + E.WK_NAMES[g.workout];
    if (g.type === 'weight') return esc(exName(g.ex)) + ': set the next target to ' + esc(targetText(g.ex, g.w, g.r));
    if (g.type === 'setting') {
      if (g.key === 'topSets') return 'Sets at the top weight: ' + g.value;
      return (g.key === 'restMain' ? 'Rest on the first exercise: ' : 'Rest on the other exercises: ') + g.value + ' seconds';
    }
    return esc(exName(g.ex)) + ': change the rep range to ' + g.lo + ' to ' + g.hi;
  }
  function fmtWhen(ms) {
    var d = new Date(ms), h = d.getHours(), m = d.getMinutes();
    return MONTHS[d.getMonth()] + ' ' + d.getDate() + ', ' + ((h + 11) % 12 + 1) + ':' + (m < 10 ? '0' : '') + m + (h < 12 ? ' AM' : ' PM');
  }

  // Reviews written by the scheduled Claude task (web copy; see src/sync.js). Each review is
  // for one person and is applied once, when that person is not in a workout. A change that no
  // longer fits is kept in the list as not applied, so it can still be applied by hand.
  function applyReviews(list) {
    list.forEach(function (r) {
      if (!r || typeof r.id !== 'string' || !prof(r.pid)) return;
      var p = prof(r.pid);
      if ((p.rvSeen || []).indexOf(r.id) >= 0 || activeSession(p.id)) return;
      p = clone(p);
      var sugs = [];
      (Array.isArray(r.changes) ? r.changes : []).slice(0, 6).forEach(function (g) {
        var res = E.applyChange(p, g, LIB, equip());
        if (res === 'invalid') return;
        var c = clone(g);
        c.why = typeof g.why === 'string' ? g.why.slice(0, 240) : '';
        c.applied = res === 'applied'; c.stale = res === 'stale';
        sugs.push(c);
      });
      p.rvSeen = (p.rvSeen || []).concat([r.id]).slice(-40);
      var summary = typeof r.summary === 'string' ? r.summary.slice(0, 1200) : '';
      if (summary || sugs.length) {
        p.review = { id: r.id, date: /^[0-9]{4}-[0-9][0-9]-[0-9][0-9]$/.test(r.date) ? r.date : today(), summary: summary, suggestions: sugs, auto: true, unread: true };
      }
      Store.saveProfile(p);
    });
  }

  function reviewCard(pid) {
    var p = prof(pid), rv = ui.review[pid], saved = p.review, body = '';

  // ---------- render ----------
  function isTyping() {
    var a = document.activeElement;
    return a && (a.tagName === 'INPUT' || a.tagName === 'SELECT' || a.tagName === 'TEXTAREA');
  }
  function render() {
    pendingRender = false;
    var html, pid = view.pid;
    if (view.name !== 'home' && view.name !== 'workout' && !prof(pid)) view = { name: 'home' };
    if (view.name === 'home') html = homeView();
    else if (view.name === 'plan') html = planView(pid);
    else if (view.name === 'workout') html = workoutView();
    else if (view.name === 'progress') html = progressView(pid);
    else if (view.name === 'settings') html = settingsView(pid);
    var key = view.name + ':' + (view.pid || '');
    var y = key === lastViewKey ? (window.pageYOffset || 0) : 0;
    lastViewKey = key;
    root.className = 'v-' + view.name;
    root.innerHTML = html + sheetHtml();
    window.scrollTo(0, y);
    tick();
  }
  function storeChanged() {
    if (Store.confirmed) { closeStale(); fixPrograms(); }
    if (BUILD && Store.confirmed) Sync.changed();
    if (isTyping()) { pendingRender = true; return; }
    render();
  }

  function tick() {
    var now = Date.now();
    Object.keys(rest).forEach(function (pid) {
      var el = root.querySelector('[data-rest="' + pid + '"]');
      if (!el) return;
      var left = Math.ceil((rest[pid].until - now) / 1000);
      el.hidden = false;
      if (left > 0) {
        el.className = 'rest';
        el.textContent = 'Rest ' + Math.floor(left / 60) + ':' + (left % 60 < 10 ? '0' : '') + (left % 60);
      } else if (left > -600) {
        el.className = 'rest over';
        el.textContent = 'Rest over';
      } else { delete rest[pid]; el.hidden = true; }
    });
  }

  // ---------- updates (the web copy only) ----------
  // The web copy carries the version it was built as (tools/build.py). The newest version is in
  // version.txt next to the page. When the two differ, the page loads itself again, but only
  // while nobody is in a workout and nobody has touched the screen for two minutes. On the iPad
  // the app never closes, so without this it would keep running an old version.
  var BUILD = window.GYM_BUILD || null;
  var upd = { checked: 0, want: null, touched: Date.now(), msg: '' };
  function tune(name, dflt) { var t = window.__gymTest; return t && t[name] !== undefined ? t[name] : dflt; }
  function updNote(text) {
    upd.msg = text;
    if (view.name === 'settings' && !isTyping()) render();
  }
  function applyUpdate(manual) {
    if (!upd.want) return;
    if (activePids().length) {
      if (manual) updNote('A newer version is ready. It will load when the workout in progress is finished.');
      return;
    }
    if (!manual && (sheet || isTyping() || view.name === 'workout' || Date.now() - upd.touched < tune('idleMs', 120000))) return;
    // The new address names the version, so a copy held by a cache on the way cannot be served
    // again. If that address is already open and the page is still old, do not try again.
    if (location.search.indexOf('v=' + upd.want) >= 0) {
      if (manual) updNote('A newer version exists but has not reached this device yet. Try again in ten minutes.');
      return;
    }
    location.replace(location.pathname + '?v=' + upd.want);
  }
  function checkUpdate(manual) {
    if (!BUILD || !window.XMLHttpRequest) return;
    var now = Date.now();
    if (!manual && now - upd.checked < tune('checkMs', 600000)) { applyUpdate(false); return; }
    upd.checked = now;
    var x = new XMLHttpRequest();
    x.onreadystatechange = function () {
      if (x.readyState !== 4) return;
      var v = x.status === 200 ? String(x.responseText).replace(/\s+/g, '') : '';
      if (!/^[0-9a-f]{6,40}$/.test(v)) {
        if (manual) updNote('Could not check. Is the Wi-Fi on?');
        return;
      }
      upd.want = v === BUILD ? null : v;
      if (manual && !upd.want) updNote('This is the newest version.');
      else applyUpdate(manual);
    };
    try { x.open('GET', 'version.txt?t=' + now, true); x.send(); } catch (e) { if (manual) updNote('Could not check. Is the Wi-Fi on?'); }
  }

  // ---------- actions ----------
  function ensureEx(p, key) {
    if (!p.ex[key]) p.ex[key] = clone(E.exState(p, key, LIB));
    return p.ex[key];
  }
  function parseList(v) {
    return String(v).split(/[,\s]+/).map(Number).filter(function (n) { return n > 0 && isFinite(n); });
  }
  function keepAwake() {
    try { if (navigator.wakeLock && navigator.wakeLock.request) navigator.wakeLock.request('screen').catch(function () {}); } catch (e) { /* not supported */ }
  }

  function logCurrent(pid, status, got, easy) {
    var s = clone(activeSession(pid));
    var c = E.cursor(s);
    if (!c) return;
    var p = prof(pid);
    E.logSet(s, c.i, c.j, status, got, easy, Date.now());
    Store.saveSession(s);
    delete ui.missed[pid];
    var next = E.cursor(s);
    if (!next) { finishSession(pid, s); return; }
    if (status === 'done' || status === 'fail') {
      var kind = s.items[c.i].sets[c.j].k;
      var secs = c.i === 0 ? p.settings.restMain : p.settings.restAcc;
      if (kind === 'light') secs = Math.min(secs, 45);
      if (secs > 0) rest[pid] = { until: Date.now() + secs * 1000 }; else delete rest[pid];
    } else delete rest[pid];
  }

  function askReview(pid) {
    var p = prof(pid), q = equip();
    var dig = E.reviewDigest(p, doneSessions(pid), LIB, today(), 16);
    var keys = Object.keys(LIB).map(function (k) { return k + ' = ' + LIB[k].name + ' [' + LIB[k].group + ', ' + LIB[k].eq + ']'; });
    var prompt = [
      'You are reviewing the training log of ' + p.name + ', who lifts at home in a garage, alone, with a light-duty rack.',
      'Method: double progression on an upper/lower split (Upper A, Lower A, Upper B, Lower B). Each exercise has a rep range.',
      'Each exercise has ' + E.topCount(p.settings) + ' sets at the top weight. When all of them are completed the target goes up by one rep (two if marked easy). At the top of the range the weight goes up one step and reps return to the bottom. A missed set repeats the same target.',
      'Equipment: barbell ' + q.bar + ' lb with ' + q.barStep + ' lb jumps; dumbbell pairs ' + q.dbPairs.join(', ') + ' lb; single dumbbells ' + (q.dbSingles || []).join(', ') + ' lb; plate-loaded dip machine and leg attachment with ' + q.machStep + ' lb jumps. Equipment codes: bar, db (pair, weight per hand), db1 (one dumbbell), mach, body.',
      'Today is ' + today() + '.',
      '', 'CURRENT PROGRAM AND NEXT TARGETS:', dig.targets.join('\n'),
      '', 'RECENT SESSIONS (top sets, weight x reps), oldest first:', dig.history.length ? dig.history.join('\n') : 'None yet.',
      '', 'EXERCISES AVAILABLE FOR SWAPS (key = name [muscle group, equipment]):', keys.join('\n'),
      '', 'Write a short, practical review. Be conservative about safety and do not suggest equipment they lack.',
      'Reply with only a JSON object in this exact shape:',
      '{"summary": "3 to 5 plain sentences addressed to the lifter as you", "suggestions": [',
      ' {"type": "swap", "workout": "UA", "from": "curl", "to": "hammer", "why": "one sentence"},',
      ' {"type": "weight", "ex": "bench", "w": 130, "r": 8, "why": "one sentence"},',
      ' {"type": "range", "ex": "bench", "lo": 6, "hi": 10, "why": "one sentence"}]}',
      'Use at most 4 suggestions, and an empty list if nothing needs changing. Use only exercise keys from the lists above. A swap must stay within the same muscle group. Weights must be ones the equipment can make.'
    ].join('\n');
    ui.review[pid] = { state: 'thinking' };
    render();
    sample.json(prompt, { cache: false }).then(function (data) {
      var out = { state: 'done', date: today(), summary: '', suggestions: [] };
      if (data && typeof data.summary === 'string') out.summary = data.summary.slice(0, 1200);
      var cur = prof(pid);
      (data && Array.isArray(data.suggestions) ? data.suggestions : []).slice(0, 4).forEach(function (g) {
        if (!g || typeof g !== 'object') return;
        var why = typeof g.why === 'string' ? g.why.slice(0, 240) : '';
        if (g.type === 'swap' && cur.program[g.workout] && cur.program[g.workout].indexOf(g.from) >= 0 && LIB[g.to] &&
          LIB[g.to].group === LIB[g.from].group && cur.program[g.workout].indexOf(g.to) < 0) {
          out.suggestions.push({ type: 'swap', workout: g.workout, from: g.from, to: g.to, why: why });
        } else if (g.type === 'weight' && LIB[g.ex] && isFinite(g.w) && isFinite(g.r) && g.w >= 0 && g.w <= 600 && g.r >= 1 && g.r <= 40) {
          out.suggestions.push({ type: 'weight', ex: g.ex, w: Number(g.w), r: Math.round(g.r), why: why });
        } else if (g.type === 'range' && LIB[g.ex] && isFinite(g.lo) && isFinite(g.hi) && g.lo >= 1 && g.hi > g.lo && g.hi <= 40) {
          out.suggestions.push({ type: 'range', ex: g.ex, lo: Math.round(g.lo), hi: Math.round(g.hi), why: why });
        }
      });
      if (!out.summary) { ui.review[pid] = { state: 'error', msg: 'Claude\'s answer could not be read. Try again.' }; render(); return; }
      ui.review[pid] = out;
      var p2 = clone(prof(pid));
      p2.review = { date: out.date, summary: out.summary, suggestions: out.suggestions };
      Store.saveProfile(p2);
    }, function (e) {
      var code = e && e.code, msg = 'The review did not finish. Try again later.';
      if (code === 'not_granted' || code === 'sampling_disabled') msg = 'Claude is not allowed on this page for this account, so reviews are off.';
      else if (code === 'rate_limited') msg = 'You have reached a Claude usage limit. Try again later.';
      else if (code === 'session_expired') msg = 'Sign in to Claude again, then retry.';
      else if (code === 'cancelled') msg = '';
      ui.review[pid] = { state: 'error', msg: msg };
      render();
    });
  }

  function applySuggestion(pid, i) {
    var p = clone(prof(pid));
    var src = (ui.review[pid] && ui.review[pid].state === 'done') ? ui.review[pid] : p.review;
    var g = src && src.suggestions && src.suggestions[i];
    if (!g || g.applied) return;
    var c = clone(g);
    if (c.type === 'weight') delete c.from;      // applied by hand: whatever the target is now
    var ok = E.applyChange(p, c, LIB, equip()) === 'applied';
    g.applied = ok; g.bad = !ok;
    if (p.review && p.review.suggestions && p.review.suggestions[i]) { p.review.suggestions[i].applied = ok; p.review.suggestions[i].bad = !ok; }
    Store.saveProfile(p);
  }

  function act(name, d) {
    var pid = d.pid, p = pid && prof(pid), s, c, st, q = equip(), dir = Number(d.dir || 0), key;
    switch (name) {
      case 'setup':
        if (profiles().length) break;
        var names = ['name1', 'name2'].map(function (id) {
          var el = document.getElementById(id);
          return el ? String(el.value).replace(/^\s+|\s+$/g, '').slice(0, 20) : '';
        }).filter(function (nm) { return nm; });
        if (!names.length) break;
        names.forEach(function (nm, i) {
          var np = E.newProfile('p' + (i + 1), nm, DEFAULT_PROGRAM);
          np.ord = i; np.color = i ? 'teal' : 'blue';
          Store.saveProfile(np);
        });
        if (!Store.data.equip) Store.saveEquip(E.defaultEquipment());
        break;
      case 'nav': view = { name: d.view, pid: pid || null }; sheet = null; break;
      case 'open-plan':
        sheet = null;
        view = activeSession(pid) ? { name: 'workout', pid: pid } : { name: 'plan', pid: pid };
        break;
      case 'continue': view = { name: 'workout', pid: pid }; keepAwake(); break;
      case 'tab': view.pid = pid; break;
      case 'gap-toggle': ui.gapOff[pid] = !ui.gapOff[pid]; break;
      case 'start':
        s = E.planSession(p, E.nextWorkout(p), today(), q, LIB, { ignoreGap: !!ui.gapOff[pid], now: Date.now(), id: 's' + Date.now() + pid });
        delete ui.gapOff[pid]; delete ui.summary[pid];
        Store.saveSession(s);
        view = { name: 'workout', pid: pid };
        keepAwake();
        break;
      case 'log':
        if (ui.lastTap[pid] && Date.now() - ui.lastTap[pid] < 600) return;   // guards against a double tap
        ui.lastTap[pid] = Date.now();
        if (d.kind === 'done') logCurrent(pid, 'done', null, 0);
        else if (d.kind === 'easy') logCurrent(pid, 'done', null, 1);
        else if (d.kind === 'veasy') logCurrent(pid, 'done', null, 2);
        else if (d.kind === 'skip') logCurrent(pid, 'skip');
        break;
      case 'miss-open':
        s = activeSession(pid); c = E.cursor(s);
        ui.missed[pid] = { n: Math.max(0, s.items[c.i].sets[c.j].r - 1) };
        break;
      case 'miss-step':
        s = activeSession(pid); c = E.cursor(s);
        ui.missed[pid].n = Math.max(0, Math.min(s.items[c.i].sets[c.j].r - 1, ui.missed[pid].n + dir));
        break;
      case 'miss-cancel': delete ui.missed[pid]; break;
      case 'miss-save': logCurrent(pid, 'fail', ui.missed[pid].n); break;
      case 'skip-ex':
        s = clone(activeSession(pid)); c = E.cursor(s);
        E.skipExercise(s, c.i, Date.now());
        Store.saveSession(s); delete rest[pid]; delete ui.missed[pid];
        if (!E.cursor(s)) finishSession(pid, s);
        break;
      case 'undo':
        s = clone(activeSession(pid));
        var lastSet = null;
        s.items.forEach(function (it) { it.sets.forEach(function (x) { if (x.st !== null && (!lastSet || x.t >= lastSet.t)) lastSet = x; }); });
        if (lastSet) { lastSet.st = null; lastSet.got = null; lastSet.easy = 0; lastSet.t = null; Store.saveSession(s); delete rest[pid]; }
        break;
      case 'finish-ask': sheet = { type: 'finish', pid: pid }; break;
      case 'finish-yes':
        sheet = null; s = activeSession(pid);
        if (s && !finishSession(pid, s)) view = { name: 'home' };
        break;
      case 'summary-close':
        delete ui.summary[pid];
        if (!activePids().length) view = { name: 'home' };
        break;
      case 'howto': sheet = { type: 'howto', key: d.key, back: sheet && sheet.type === 'ex' ? sheet : null }; break;
      case 'sheet-close': sheet = sheet && sheet.back ? sheet.back : null; break;
      case 'wk-sheet': sheet = { type: 'wk', pid: pid }; break;
      case 'wk-set':
        p = clone(p); p.rot = Number(d.i); Store.saveProfile(p); sheet = null;
        break;
      case 'adj-sheet': sheet = { type: 'adj', pid: pid }; break;
      case 'adj-w':
      case 'adj-r':
        s = clone(activeSession(pid)); c = E.cursor(s);
        var it = s.items[c.i], eq = LIB[it.ex].eq, w = it.target.w, r = it.target.r;
        if (name === 'adj-w') {
          var nw = w, k, t2;
          for (k = 0; k < Math.abs(dir); k++) {
            t2 = dir > 0 ? E.stepUp(nw, eq, q) : E.stepDown(nw, eq, q);
            if (t2 === null || t2 === nw) break;
            nw = t2;
          }
          if (nw === w) break;
          w = nw;
        } else r = Math.max(1, Math.min(50, r + dir));
        var keepStart = it.needsStart;
        E.retarget(s, c.i, w, r, p, q, LIB);
        s.items[c.i].needsStart = keepStart;
        Store.saveSession(s);
        break;
      case 'ex-sheet': sheet = { type: 'ex', pid: pid, wk: d.wk, i: Number(d.i) }; break;
      case 'ex-w': case 'ex-r': case 'ex-lo': case 'ex-hi': case 'ex-lower':
        p = clone(p); key = p.program[d.wk][Number(d.i)]; st = ensureEx(p, key);
        var eq2 = LIB[key].eq;
        if (name === 'ex-w') {
          if (st.w === null) st.w = E.startWeight(key, LIB, q);
          else { var x = dir > 0 ? E.stepUp(st.w, eq2, q) : E.stepDown(st.w, eq2, q); if (x !== null) st.w = x; }
          st.flag = null; st.fails = 0;
        } else if (name === 'ex-r') st.r = Math.max(st.lo, Math.min(st.hi, st.r + dir));
        else if (name === 'ex-lo') { st.lo = Math.max(1, Math.min(st.hi - 1, st.lo + dir)); st.r = Math.max(st.lo, st.r); }
        else if (name === 'ex-hi') { st.hi = Math.max(st.lo + 1, Math.min(40, st.hi + dir)); st.r = Math.min(st.hi, st.r); }
        else if (name === 'ex-lower' && st.w !== null) { st.w = E.dropWeight(st.w, eq2, q); st.fails = 0; st.flag = null; }
        Store.saveProfile(p);
        break;
      case 'swap':
        p = clone(p); E.swapExercise(p, d.wk, Number(d.i), d.key); Store.saveProfile(p);
        break;
      case 'set-lighton': p = clone(p); p.settings.lightOn = d.val; Store.saveProfile(p); break;
      case 'set-lead': p = clone(p); p.settings.leadIn = !p.settings.leadIn; Store.saveProfile(p); break;
      case 'set-num':
        p = clone(p);
        var curNum = d.key === 'topSets' ? E.topCount(p.settings) : p.settings[d.key];
        p.settings[d.key] = Math.max(Number(d.min), Math.min(Number(d.max), curNum + dir * Number(d.step)));
        Store.saveProfile(p);
        break;
      case 'equip-save':
        var nq = clone(q);
        function val(id) { var el = document.getElementById(id); return el ? el.value : ''; }
        var bar = parseList(val('eq-bar'))[0], bs = parseList(val('eq-barstep'))[0], ms = parseList(val('eq-mach'))[0];
        var plates = parseList(val('eq-plates')), pairs = parseList(val('eq-pairs'));
        if (bar) nq.bar = bar;
        if (bs) nq.barStep = bs;
        if (ms) nq.machStep = ms;
        if (plates.length) nq.plates = plates.sort(function (a, b) { return b - a; });
        if (pairs.length) nq.dbPairs = pairs.sort(function (a, b) { return a - b; });
        nq.dbSingles = parseList(val('eq-singles')).sort(function (a, b) { return a - b; });
        Store.saveEquip(nq);
        break;
      case 'reset':
        if (!ui.resetArm[pid]) { ui.resetArm[pid] = true; break; }
        delete ui.resetArm[pid];
        var fresh = E.newProfile(p.id, p.name, DEFAULT_PROGRAM);
        fresh.ord = p.ord; fresh.color = p.color; fresh.rev = p.rev; fresh.settings = p.settings;
        fresh.resetAt = Date.now();
        Store.saveProfile(fresh);
        view = { name: 'home' };
        break;
      case 'review': if (sample) { askReview(pid); return; } break;
      case 'apply-sug': applySuggestion(pid, Number(d.i)); break;
      case 'update-now': upd.msg = 'Checking.'; checkUpdate(true); break;
      case 'sync-save':
        var tokEl = document.getElementById('sync-token');
        var tok = String(tokEl ? tokEl.value : ui.tokenDraft || '').replace(/[ \t\r\n]+/g, '');
        if (!tok) break;
        ui.tokenDraft = '';
        Sync.setToken(tok);
        break;
      case 'sync-code':
        var codeEl = document.getElementById('sync-code');
        ui.codeDraft = codeEl ? codeEl.value : ui.codeDraft || '';
        Sync.useCode(ui.codeDraft, function (kind, text) {
          ui.codeMsg = kind === 'ok' ? null : { text: text, bad: kind === 'error', busy: kind === 'busy' };
          if (kind === 'ok') ui.codeDraft = '';
          if (view.name === 'settings' && !isTyping()) render();
        });
        break;
      case 'sync-now': Sync.pushNow(); break;
      case 'sync-remove': Sync.removeToken(); break;
      case 'review-ok':
        if (p && p.review) { p = clone(p); p.review.unread = false; Store.saveProfile(p); }
        break;
    }
    if (name !== 'reset') ui.resetArm = {};
    if (name !== 'update-now') upd.msg = '';
    render();
  }

  root.addEventListener('click', function (ev) {
    var t = ev.target.closest ? ev.target.closest('[data-act]') : null;
    if (!t || t.disabled) return;
    act(t.getAttribute('data-act'), t.dataset);
  });
  root.addEventListener('change', function (ev) {
    var t = ev.target;
    if (t && t.getAttribute('data-change') === 'chart-ex') {
      ui.chartEx[t.dataset.pid] = t.value;
      t.blur();
      render();
    }
  });
  root.addEventListener('focusout', function () {
    setTimeout(function () { if (pendingRender && !isTyping()) render(); }, 50);
  });
  document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape' && sheet) { sheet = null; render(); } });
  window.addEventListener('resize', function () { if (view.name === 'workout' && !isTyping()) render(); });
  document.addEventListener('visibilitychange', function () { if (!document.hidden && view.name === 'workout') keepAwake(); });
  setInterval(tick, 500);
  if (BUILD) {
    Sync.init({
      build: BUILD,
      getData: function () { return Store.data; },
      busy: function () { return activePids().length > 0; },
      onReviews: applyReviews,
      onChange: function () { if ((view.name === 'settings' || view.name === 'home') && !sheet && !isTyping()) render(); }
    });
    ['touchstart', 'mousedown', 'keydown'].forEach(function (n) {
      document.addEventListener(n, function () { upd.touched = Date.now(); }, true);
    });
    // A long token typed into Settings is kept if the screen is drawn again before it is saved.
    root.addEventListener('input', function (ev) {
      if (ev.target && ev.target.id === 'sync-token') ui.tokenDraft = ev.target.value;
      if (ev.target && ev.target.id === 'sync-code') ui.codeDraft = ev.target.value;
    });
    setTimeout(function () { checkUpdate(false); Sync.tick(true); }, 5000);
    setInterval(function () { checkUpdate(false); Sync.tick(false); }, 60000);   // each asks its server at most once in ten minutes
    document.addEventListener('visibilitychange', function () { if (!document.hidden) { checkUpdate(false); Sync.tick(true); } });
    window.addEventListener('pageshow', function () { checkUpdate(false); });
  }

  Store.init(storeChanged);
  if (window.claude && typeof window.claude.use === 'function') {
    window.claude.use('sample').then(function (fn) { if (fn) { sample = fn; if (!isTyping()) render(); } }, function () {});
  }
})();
</script>
</body>
</html>
